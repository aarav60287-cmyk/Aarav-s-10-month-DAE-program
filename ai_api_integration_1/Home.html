<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brainrot Weekly</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Ztyles.css">
</head>
<body>

  <header>
    <h1>Brainrot Weekly</h1>
    <nav>
      <ul>
        <li><a href="About.html">About</a></li>
        <li><a href="Blog.html">Blog</a></li>
        <li><a href="Translator.html">Translator</a></li>
        <li><a href="Trending.html">Trending</a></li>
      </ul>
    </nav>
  </header>

  <section class="welcome-box">
    <h2>Word of the Day</h2>
    <div id="wotdCard" class="feature-card" style="width: 100%; max-width: 500px; margin: 20px auto; min-height: 80px;">
      <h3 id="wotdTerm" style="color: var(--color-primary); font-size: 1.4rem;">Loading...</h3>
    </div>
  </section>

  <script>
    async function loadWordOfTheDay() {
      const termEl = document.getElementById("wotdTerm");

      try {
        const response = await fetch("https://api.allorigins.win/raw?url=https://api.urbandictionary.com/v0/random", {
          method: "GET",
          headers: { "Content-Type": "application/json" }
        });

        if (response.status === 200) {
          const data = await response.json();
          termEl.innerText = data.list[0].word;
        } else {
          termEl.innerText = "No cap, API is cooked.";
        }
      } catch (error) {
        termEl.innerText = "Failed to fetch. L + ratio.";
        console.error("WOTD Fetch Error:", error);
      }
    }

    loadWordOfTheDay();
  </script>

</body>
</html>
