<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Brainrot Weekly</title>
  <link rel="stylesheet" href="./Ztyles.css">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
  <main>
    <div class="box">
      <h1>Brainrot Weekly</h1>
      <p class="section-heading" id="modeLabel">Log in for your weekly dose of brainrot</p>

      <div class="auth-buttons">
        <button aria-label="Log in with Google" type="button">
          <img src="https://www.google.com/images/branding/googleg/1x/googleg_standard_color_128dp.png" alt="Google Logo" width="28">
        </button>
        <button aria-label="Log in with Facebook" type="button">
          <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png" alt="Facebook Logo" width="28">
        </button>
        <button aria-label="Log in with Apple" type="button">
          <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple Logo" width="28">
        </button>
      </div>

      <input type="email" class="post-input" id="emailInput" placeholder="Email" required>
      <input type="password" class="post-input" id="passInput" placeholder="Password" required>
      <div id="confirmWrap" style="display: none;">
        <input type="password" class="post-input" id="confirmInput" placeholder="Confirm Password">
      </div>

      <p id="msgBox" style="font-weight: 700; font-size: 0.9rem; min-height: 20px; color: #ff4d4d; margin: 6px 0;"></p>

      <div style="margin-top: 12px;">
        <button class="login-button" id="mainBtn" onclick="handleMain()">Log In</button>
      </div>

      <p style="font-weight: 700; margin-top: 12px; font-size: 0.9rem; cursor: pointer; text-decoration: underline;" onclick="toggleMode()" id="toggleLink">
        Don't have an account? Sign Up
      </p>

      <footer>
        <p class="footer-text-small">Sid and Pichy asked me to put their name here.</p>
      </footer>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCRGeBUhsZoF9Epl2xpaJ4KISfunl9lLsI",
      authDomain: "brainrot-weekly.firebaseapp.com",
      projectId: "brainrot-weekly",
      storageBucket: "brainrot-weekly.firebasestorage.app",
      messagingSenderId: "46085324988",
      appId: "1:46085324988:web:f330daeb1db3cc6c36d0b9",
      measurementId: "G-D9LTXGCW3S"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    emailjs.init("cXMJMX3GNZFyL7wlP");

    let isSignup = false;

    window.toggleMode = function() {
      isSignup = !isSignup;
      document.getElementById('modeLabel').innerText = isSignup ? "Create your account" : "Log in for your weekly dose";
      document.getElementById('mainBtn').innerText = isSignup ? "Sign Up" : "Log In";
      document.getElementById('mainBtn').className = isSignup ? "signup-button" : "login-button";
      document.getElementById('confirmWrap').style.display = isSignup ? "block" : "none";
      document.getElementById('toggleLink').innerText = isSignup
        ? "Already have an account? Log In"
        : "Don't have an account? Sign Up";
      const msg = document.getElementById('msgBox');
      msg.style.color = "#ff4d4d";
      msg.innerText = "";
    }

    window.handleMain = async function() {
      const email = document.getElementById('emailInput').value.trim();
      const pass = document.getElementById('passInput').value;
      const msg = document.getElementById('msgBox');
      const btn = document.getElementById('mainBtn');

      if (!email || !pass) {
        msg.style.color = "#ff4d4d";
        msg.innerText = "Fill everything out, blud.";
        return;
      }

      btn.disabled = true;
      btn.innerText = "Loading...";

      if (isSignup) {
        const confirm = document.getElementById('confirmInput').value;
        if (pass !== confirm) {
          msg.style.color = "#ff4d4d";
          msg.innerText = "Passwords don't match, fam.";
          btn.disabled = false;
          btn.innerText = "Sign Up";
          return;
        }
        if (pass.length < 6) {
          msg.style.color = "#ff4d4d";
          msg.innerText = "Password needs 6+ chars, no cap.";
          btn.disabled = false;
          btn.innerText = "Sign Up";
          return;
        }

        try {
          await createUserWithEmailAndPassword(auth, email, pass);

          try {
            await emailjs.send("service_m8d4h8s", "template_9zq2kvd", {
              to_name: email.split("@")[0],
              to_email: email,
            });
          } catch (e) {
            console.warn("EmailJS failed:", e);
          }

          msg.style.color = "#2ecc71";
          msg.innerText = "Account created! Welcome email sent. Redirecting...";
          setTimeout(() => { window.location.href = "Home.html"; }, 1500);

        } catch (error) {
          msg.style.color = "#ff4d4d";
          msg.innerText = friendlyError(error.code);
          btn.disabled = false;
          btn.innerText = "Sign Up";
        }

      } else {
        try {
          await signInWithEmailAndPassword(auth, email, pass);
          msg.style.color = "#2ecc71";
          msg.innerText = "You're in. Redirecting...";
          setTimeout(() => { window.location.href = "Home.html"; }, 1200);

        } catch (error) {
          msg.style.color = "#ff4d4d";
          msg.innerText = friendlyError(error.code);
          btn.disabled = false;
          btn.innerText = "Log In";
        }
      }
    }

    function friendlyError(code) {
      switch (code) {
        case "auth/email-already-in-use": return "That email's already registered, fam.";
        case "auth/invalid-email": return "That email looks cooked. Try again.";
        case "auth/wrong-password": return "Wrong password, L.";
        case "auth/user-not-found": return "No account found with that email.";
        case "auth/invalid-credential": return "Wrong email or password, L.";
        case "auth/too-many-requests": return "Too many attempts. Chill for a sec.";
        default: return "Something went cooked. Try again.";
      }
    }
  </script>

  <footer>
    <p>&copy; 2026 Brainrot Weekly. Built different.</p>
  </footer>
  
</body>
</html>
