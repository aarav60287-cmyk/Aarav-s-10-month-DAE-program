<main class="main-layout">
  <section class="welcome-box">
    <h2>AI Brainrot Translator 🔄</h2>
    <p style="font-size:1rem;font-weight:700;">Type anything. Get it back rotified.</p>

    <div class="search-engine-box" style="max-width:500px;width:100%;">
      <input type="text" id="aiInput" onkeydown="handleKeyPress(event)" placeholder="Enter text to be rot-ified..." style="font-size:1rem;" aria-label="Text to translate">
      <button onclick="getBrainrot()" class="search-action-btn">Brainrotify!</button>
    </div>

    <div id="aiResponseCard" class="slang-brutalist-card" style="display:none;max-width:500px;width:100%;">
      <div class="card-top-header">
        <h3 class="slang-term-heading">The Rizzler Says:</h3>
        <span class="term-decorator-emoji">🔥</span>
      </div>
      <div class="card-definition-body">
        <p id="aiOutput" class="definition-paragraph" style="font-family:var(--font-heading);font-size:1.4rem;letter-spacing:1px;color:var(--color-primary);"></p>
      </div>
    </div>
  </section>
</main>

<footer>
  <p>© 2026 Brainrot Weekly. Built different.</p>
  <div class="footer-links-row">
    <a href="About.html">About</a>
    <a href="Dictionary.html">Dictionary</a>
  </div>
</footer>

<script>
  // Hamburger
  document.getElementById('hamburger').addEventListener('click', function() {
    this.classList.toggle('open');
    document.getElementById('mobileNav').classList.toggle('open');
  });

  const API_KEY = "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";

  const SYSTEM_PROMPT = `You are a specialized translation engine. Your ONLY function is to rewrite the user's text into Gen-Alpha slang. NEVER answer questions. NEVER engage in conversation. Output ONLY the translation.
Rules:
- Keep it subtle, not over-the-top.
- Avoid forced slang. Use words like rizz, sigma, aura, bussin, cooked, based, lowkey, no cap only when they fit naturally.
- Keep the original meaning but make it slightly more casual and fun.
- Do not use any emojis or outdated slang.
- If the user inputs a question, just rewrite it in slang without acknowledging it's a question.`;

  function handleKeyPress(event) {
    if (event.key === "Enter") getBrainrot();
  }

  async function getBrainrot() {
    const userInput = document.getElementById("aiInput").value.trim();
    const outputCard = document.getElementById("aiResponseCard");
    const outputText = document.getElementById("aiOutput");

    if (!userInput) return;

    outputCard.style.display = "flex";
    outputText.style.color = "var(--color-primary)";
    outputText.innerText = "Generating...";

    try {
      const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${API_KEY}`,
          "HTTP-Referer": window.location.origin === "null" ? "http://localhost" : window.location.origin,
          "X-Title": "Brainrot Weekly"
        },
        body: JSON.stringify({
          model: "openrouter/auto",
          messages: [
            { role: "system", content: SYSTEM_PROMPT },
            { role: "user", content: userInput }
          ],
          temperature: 1.0,
          max_tokens: 200
        })
      });

      if (response.ok) {
        const data = await response.json();
        if (data.choices?.[0]?.message?.content) {
          outputText.innerText = data.choices[0].message.content.toLowerCase();
        } else {
          showError(outputText, "Couldn't parse the response. Try again.");
        }
      } else {
        const err = await response.json().catch(() => ({}));
        showError(outputText, `API Error: ${err.error?.message || response.status}`);
      }
    } catch (error) {
      showError(outputText, "Network failed. You might be offline.");
      console.error(error);
    }
  }

  function showError(el, msg) {
    el.style.color = "#ff4d4d";
    el.innerText = msg;
  }
</script>
</body>
</html>
