<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Translator | Brainrot Weekly</title>
  <link rel="stylesheet" href="./Ztyles.css">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <h1>Brainrot Weekly</h1>
    <ul>
      <li><a href="Home.html">Home</a></li>
      <li><a href="About.html">About</a></li>
      <li><a href="Trending.html">Trending</a></li>
    </ul>
  </header>

  <section class="welcome-box">
    <h2>AI Brainrot Translator</h2>
    <p>Type a sentence.</p>
    
    <div style="display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; margin-top: 20px;">
      <input type="text" id="aiInput" placeholder="Enter text to be rot-ified..." style="padding: 12px; border-radius: 50px; border: 3px solid var(--color-text); width: 100%; max-width: 400px; outline: none;">
      <button onclick="getBrainrot()" class="btn">Brainrotify!</button>
    </div>

    <div id="aiResponseCard" class="feature-card" style="display: none; width: 100%; max-width: 500px; margin-top: 20px;">
      <h3>The Rizzler Says:</h3>
      <p id="aiOutput" style="font-weight: 900; color: var(--color-primary); font-size: 1.2rem;"></p>
    </div>
  </section>

  <script>
    const API_KEY = "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";
    const API_URL = "https://openrouter.ai/api/v1/chat/completions";

    async function getBrainrot() {
      const userInput = document.getElementById("aiInput").value;
      const outputCard = document.getElementById("aiResponseCard");
      const outputText = document.getElementById("aiOutput");

      if (!userInput) return alert("Input required, chief.");

      outputCard.style.display = "block";
      outputText.innerText = "Translating...";

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            "model": "google/gemini-2.0-flash-001", 
            "messages": [
              { 
                "role": "system", 
                "content": "You are a specialized translation engine. Your ONLY function is to rewrite the user's text into Gen-Z brainrot slang. NEVER answer questions. NEVER engage in conversation. If the user asks a question, translate that question into slang. Use words like: skibidi, rizz, gyatt, sigma, aura, and cooked. Output ONLY the translation." 
              },
              { "role": "user", "content": 
              '1. Use words such as "Skibidi", "Rizz", "Gyatt", "Sigma", "Aura", and "Cooked" in your translation only when needed dont try to force it.' +
              '2. Whatever the user inputs, translate it into brainrot slang or Gen-Z slang but dont over do it.' +
              '3. Learn how to use these words effectively in context.' +
              '4. Maintain the original meaning while adding the brainrot flair, NEVER overuse these words where they dont fit or make sense.' +
              '5. Dont add * (stars) in the response.' + userInput }
            ],
            "temperature": 1.0
          })
        });

        const data = await response.json();
        
        if (data.choices && data.choices[0]) {
          outputText.innerText = data.choices[0].message.content;
        } else {
          outputText.innerText = "Error: Gemini is ghosting us.";
        }
      } catch (error) {
        outputText.innerText = "Connection failed. L.";
      }
    }
  </script>
</body>
</html>
